apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: demo-app
  namespace: demo-app
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: gateways
  listeners:
    - name: https
      hostname: demo-app.american-broomstick.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: demo-app-tls
      allowedRoutes:
        namespaces:
          from: Same
